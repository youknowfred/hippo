# ROADMAP.v2.md (ratified 2026-10-03) is the design record: why each item exists,
# its done-means, the owner rulings. THIS file is where status lives. Each
# release updates the rows it ships, in the same PR. The earlier trains
# (ROADMAP.yaml, ROADMAP.enhancements*.yaml, ROADMAP.dream.yaml) are history:
# closed, kept for their reasoning, and no longer updated.
