# The owner rulings recorded in ROADMAP.v2.md section 8; all ratified 2026-10-03.
owner_rulings:
  - id: V2Q-1
    question: "One reviewed changeset may stand in for N per-item gates"
    ruling: "(b) only evidence-quiet graduates and lossless format rewrites"
    status: ratified
  - id: V2Q-2
    question: "In-session served recall vs the daemon ban"
    ruling: "(b) opt-in mcp_tool hook into the session's own server"
    status: ratified
  - id: V2Q-3
    question: "Native-memory contract direction"
    ruling: "(B) redirect native writes to an inbox, floor by CLAUDE.md import; confirmed or revised by PLT-1 before NAT-2"
    status: ratified
  - id: V2Q-4
    question: "Frozen-surface policy"
    ruling: "freeze a core set; new verbs eligible after 2 releases plus usage"
    status: ratified
  - id: V2Q-5
    question: "Derived citations out of committed frontmatter"
    ruling: "yes, with a <=1% parity gate"
    status: ratified
  - id: V2Q-6
    question: "Deprecation window length"
    ruling: "two minors, usage-counted, at most one dated extension"
    status: ratified
  - id: V2Q-7
    question: "Dream's fate"
    ruling: "keep the Tier-A linker; cut the rest unless >=+0.02 field recall@10 by v1.43"
    status: ratified
  - id: V2Q-8
    question: "Calm SessionStart by default at v2.0"
    ruling: "yes"
    status: ratified
  - id: V2Q-9
    question: "Python 3.11 floor at v2.0"
    ruling: "yes"
    status: ratified
  - id: V2Q-10
    question: "LDG-1"
    ruling: "direction A now, build in v2.x"
    status: ratified
  - id: V2Q-11
    question: "Release gate"
    ruling: "non-linear-merge check now; enforce_admins for the v2.0.0 cut"
    status: ratified
  - id: V2Q-12
    question: "Reach inside v2.0"
    ruling: "marketplace submission only"
    status: ratified

