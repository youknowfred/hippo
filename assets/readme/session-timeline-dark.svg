<svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One Claude Code session and where hippo acts. Session starts: SessionStart refreshes the index and gives one report. You send a prompt: UserPromptSubmit recalls into the prompt. Claude edits files: PreToolUse runs the floor write gate and PostToolUse shows a first-touch reminder. A subagent ends: SubagentStop captures a seed. Context compacts: PreCompact nudges to save durable facts first. Session ends: SessionEnd captures a seed for /hippo:tend. All session long the MCP server answers its ten tools; warm recall and the high profile's Qwen3 models run there.">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #E6F4F5; }
  .h { font-size: 15px; font-weight: 600; }
  .s { font-size: 12.5px; fill: #9DBFC3; }
  .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: #66C3CA; }
  .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 12px; }
  .ms { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 12px; fill: #9DBFC3; }
  .mw { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 12px; fill: #F0B35A; }
  .card { fill: #10292C; stroke: #2A5E63; stroke-width: 1.5; }
  .panel { fill: #0B1E20; stroke: #2A5E63; stroke-width: 1.5; }
  .solid { fill: #66C3CA; }
  .on { fill: #0C3B40; }
  .arrow { stroke: #66C3CA; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dash { stroke: #2E8F98; stroke-width: 2; fill: none; stroke-dasharray: 5 6; stroke-linecap: round; }
  .head { fill: #66C3CA; }
  .track { fill: #16363A; }
  .bar { fill: #2E8F98; }
  .best { fill: #66C3CA; }
</style>
<text class="k" x="18" y="26">ONE SESSION, AND WHERE HIPPO ACTS</text>
<text class="s" x="18" y="46">Seven hooks fire on their own; the MCP server answers whenever Claude asks.</text>
<path class="arrow" d="M18 196 H850"/>
<path class="head" d="M862 196 L850 190 L850 202 Z"/>
<rect class="card" x="14" y="72" width="132" height="86" rx="10"/>
<text class="h" x="80" y="100" text-anchor="middle" font-size="12">SessionStart</text>
<text class="s" x="80" y="122" text-anchor="middle" font-size="12">refresh the index,</text>
<text class="s" x="80" y="139" text-anchor="middle" font-size="12">one report</text>
<path class="arrow" d="M80 158 V188"/>
<circle class="solid" cx="80" cy="196" r="6"/>
<text class="h" x="80" y="224" text-anchor="middle" font-size="12.5">Session starts</text>
<rect class="card" x="154" y="72" width="132" height="86" rx="10"/>
<text class="h" x="220" y="100" text-anchor="middle" font-size="12">UserPromptSubmit</text>
<text class="s" x="220" y="122" text-anchor="middle" font-size="12">recall into</text>
<text class="s" x="220" y="139" text-anchor="middle" font-size="12">the prompt</text>
<path class="arrow" d="M220 158 V188"/>
<circle class="solid" cx="220" cy="196" r="6"/>
<text class="h" x="220" y="224" text-anchor="middle" font-size="12.5">You send a prompt</text>
<rect class="card" x="294" y="72" width="132" height="86" rx="10"/>
<text class="h" x="360" y="100" text-anchor="middle" font-size="12">Pre/PostToolUse</text>
<text class="s" x="360" y="122" text-anchor="middle" font-size="12">floor write gate,</text>
<text class="s" x="360" y="139" text-anchor="middle" font-size="12">first-touch reminder</text>
<path class="arrow" d="M360 158 V188"/>
<circle class="solid" cx="360" cy="196" r="6"/>
<text class="h" x="360" y="224" text-anchor="middle" font-size="12.5">Claude edits files</text>
<rect class="card" x="434" y="72" width="132" height="86" rx="10"/>
<text class="h" x="500" y="100" text-anchor="middle" font-size="12">SubagentStop</text>
<text class="s" x="500" y="122" text-anchor="middle" font-size="12">capture a seed</text>
<text class="s" x="500" y="139" text-anchor="middle" font-size="12">of its work</text>
<path class="arrow" d="M500 158 V188"/>
<circle class="solid" cx="500" cy="196" r="6"/>
<text class="h" x="500" y="224" text-anchor="middle" font-size="12.5">A subagent ends</text>
<rect class="card" x="574" y="72" width="132" height="86" rx="10"/>
<text class="h" x="640" y="100" text-anchor="middle" font-size="12">PreCompact</text>
<text class="s" x="640" y="122" text-anchor="middle" font-size="12">save durable</text>
<text class="s" x="640" y="139" text-anchor="middle" font-size="12">facts first</text>
<path class="arrow" d="M640 158 V188"/>
<circle class="solid" cx="640" cy="196" r="6"/>
<text class="h" x="640" y="224" text-anchor="middle" font-size="12.5">Context compacts</text>
<rect class="card" x="714" y="72" width="132" height="86" rx="10"/>
<text class="h" x="780" y="100" text-anchor="middle" font-size="12">SessionEnd</text>
<text class="s" x="780" y="122" text-anchor="middle" font-size="12">capture a seed</text>
<text class="s" x="780" y="139" text-anchor="middle" font-size="12">for /hippo:tend</text>
<path class="arrow" d="M780 158 V188"/>
<circle class="solid" cx="780" cy="196" r="6"/>
<text class="h" x="780" y="224" text-anchor="middle" font-size="12.5">Session ends</text>
<rect class="panel" x="18" y="250" width="844" height="96" rx="12"/>
<text class="k" x="38" y="276">MCP SERVER · ALL SESSION LONG</text>
<text class="m" x="38" y="302">recall · inspect · new_memory · tend · doctor · setup · trust · share · dream · review</text>
<text class="s" x="38" y="328">Mid-turn questions and subagents. Warm recall answers the prompt hook from here, and the high profile&#8217;s Qwen3 models load only here.</text>
</svg>
