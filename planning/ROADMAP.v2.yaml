# Amendment 1: the estate evaluation (ROADMAP.v2.amendment-1.md).
# RATIFIED 2026-11-12: the owner accepted every recommendation in its section A6.
# Its items keep their own block because their design record is the amendment,
# not ROADMAP.v2.md section 5; status vocabulary and release rows are the
# ledger's. tests/test_roadmap_v2_ledger.py keeps these ids in step with the
# amendment's section A4 and apart from the ids ratified on 2026-10-03.
amendment_1:
  design_record: ROADMAP.v2.amendment-1.md
  status: ratified
  proposed: 2026-11-12  # at v1.42.8
  ratified: 2026-11-12
  items:
    - id: HOT-7
      title: "Recall lanes by kind"
      size: L
      release: "v1.44.0"
      status: done
      deps: [OBS-5, OBS-10]
      ruling: V2Q-14
      issue: "#155"
      note: "built as an opt-in: the lanes act only for a corpus that declares journals, and an undeclared corpus is byte-identical. Replay 2026-11-12: em-growth-labs journal share 14.4% to 0%, behavior share 26.1% to 36.4%. Two replay gates read short: hook-mode hard-set recall@10 fell 0.029 on em-growth-labs and 0.04 on Skyline (rows whose only expected file is a journal), and Skyline's behavior share stays 0% because its behavior memories are all in its floor. The 14-day field gate reads hook.injected_by_lane and hook.rendered_by_lane, first on 2026-11-26. The issue-join admission waits for GP-S4. Index schema 8"
    - id: HOT-8
      title: "An injection count that scales with signal"
      size: M
      release: "v1.45.0"
      status: done
      deps: [HOT-7]
      issue: "#155"
      note: "built in v1.45.0 as ruled on 2026-11-13: the count is decided per row (a weak-signal prompt serves at most five rows, each with evidence of its own), not by one margin per query, which cost emgl's hook-mode hard set 0.057 or more in simulation. Median rows per injecting prompt 10/10/8 -> 5/5/3 on three corpora with the hard sets within 0.02. Missed: emgl chars per injecting prompt, 1,399 against 1,000"
    - id: HOT-9
      title: "Hub damping in neighbor expansion"
      size: S
      release: "v1.44.0"
      status: done
      issue: "#155"
      note: "on by default (HIPPO_HUB_DAMPING=0 turns it off). Hard-set recall unchanged on three corpora; the multi-hop subset is 0.0 at base, so that half of the gate holds only trivially; the 14-day share needs field time"
    - id: HOT-10
      title: "A soft band at the dense floor, and a sweep that stays current"
      size: M
      release: "v1.43.0"
      status: partial
      note: "pulled into v1.43.0: the band (default 0.002) and the stale-sweep WARN ship. Not done: the sweep does not run in the scheduled sleep (it loads the embedding model; TND-7 is unbuilt). Two gates read short on 2026-11-12: off-topic abstention 7/11, 7/11, 6/11 on hippo, Skyline, em-growth-labs against 8/11, the same before and after; and near-floor repeat drops on em-growth-labs"
      issue: "#156"
    - id: HOT-11
      title: "Digest headings as recall units"
      size: M
      release: "v1.45.0"
      status: done
      deps: [HOT-7]
      issue: "#157"
      note: "built in v1.45.0: folded sections live in a sub-index beside the main one and are extra rows in explicit recall; the prompt hook shows one only when the prompt names it. Probe recall@10 0.00 -> 0.80 (gate 0.8). Missed: cold build CPU on emgl, +27% against 25%"
    - id: HOT-12
      title: "Recall for subagents"
      size: M
      release: "v2.x"
      status: planned
      deps: [PLT-3]
      ruling: V2Q-24
    - id: OBS-10
      title: "Opened-after-recall"
      size: S
      release: "v1.43.0"
      status: done
      ruling: V2Q-15
      issue: "#155"
      note: "built ahead of ratification as the measurement instrument the new gates read; report-only. Measured 2026-11-12: em-growth-labs 11/10,986, Skyline 4/7,708, hippo 125/6,563"
    - id: OBS-11
      title: "Say why a recall ran BM25-only"
      size: S
      release: "v1.44.0"
      status: done
      note: "built after v1.43.0 was cut, so it ships in v1.44.0. The 7-day field reading uses hook.backend_reason"
      issue: "#156"
    - id: OUT-1
      title: "An outbox that recall already sees"
      size: L
      release: "v1.44.0"
      status: done
      note: "both halves: saves (v1.43.0) and every tend verdict that edits a memory (v1.44.0) land in the outbox. The cost of a shadowing copy on recall is cut, not gone"
      deps: [RWY-3]
      ruling: V2Q-16
    - id: OUT-2
      title: "`hippo ship`"
      size: M
      release: "v1.44.0"
      status: done
      deps: [OUT-1]
      note: "the commit is made with git plumbing: no push, no working-tree change, and the repository's git hooks do not run for it. K15 needs 14 days with the outbox on"
    - id: OUT-3
      title: "An index that reads the default branch"
      size: L
      release: "v2.x"
      status: planned
      deps: [OUT-1, OUT-2]
      ruling: V2Q-16
    - id: OUT-4
      title: "Consent that travels with the bytes"
      size: M
      release: "v2.0.0"
      status: planned
      deps: [OBS-6]
      ruling: V2Q-17
      note: "not built as chartered: the classification V2Q-17 asked for came in on 2026-11-13 and found 0 of 67 withheld memories written by a hippo verb (56 native path, 10 file tool, 1 unknown). Its route is taken by OUT-5 (amendment 2, ruling V2Q-29); the row stays for v2.0.0"
    - id: OWN-1
      title: "A git home for the user tier"
      size: M
      release: "v1.43.0"
      status: done
      note: "pulled into v1.43.0, which was cut from main on 2026-11-12 with everything merged"
      ruling: V2Q-18
      issue: "#158"
    - id: OWN-2
      title: "Promotion as a tend kind"
      size: M
      release: "v1.45.0"
      status: done
      deps: [TND-2]
      ruling: V2Q-18
      note: "built in v1.45.0: a `promote` tend kind with a promote shape and a drifted shape. The scan finds 5 drifted pairs on the estate, 4 of them true. Missed: the 10-probe gate, because a lesson that lives in one corpus only has no twin and is never proposed"
    - id: OWN-3
      title: "Read-only recall across declared siblings"
      size: M
      release: "v2.x"
      status: planned
      deps: [OWN-2, HOT-7]
      ruling: V2Q-19
    - id: JRN-1
      title: "`hippo fold`"
      size: L
      release: "v2.x"
      status: planned
      deps: [HOT-11]
      ruling: V2Q-20
    - id: JRN-2
      title: "A time-to-live that proposes"
      size: S
      release: "v2.x"
      status: planned
      deps: [JRN-1]
    - id: GAT-1
      title: "A write-time gate"
      size: M
      release: "v1.43.0"
      status: done
      note: "pulled into v1.43.0, which was cut from main on 2026-11-12 with everything merged"
      ruling: V2Q-22
    - id: GAT-2
      title: "A commit-time gate and declared budgets"
      size: M
      release: "v1.43.0"
      status: done
      note: "pulled into v1.43.0. Ruled 2026-11-12 after the 30-day replay: status words in memory bodies are a write-time warning only, never a failed commit"
      deps: [GAT-1]
    - id: GAT-3
      title: "Declared floor sections and a pointer line of its own"
      size: S
      release: "v1.43.0"
      status: done
      note: "pulled into v1.43.0, which was cut from main on 2026-11-12 with everything merged"
    - id: GAT-4
      title: "One versioned `CONVENTIONS.md`"
      size: S
      release: "v1.45.0"
      status: done
      note: "built in v1.45.0: the asset carries a version stamp, doctor classifies a corpus's copy, `hippo setup --conventions` refreshes it, and local rules go in `CONVENTIONS.local.md`. v1.46.1: the refresh lands where the corpus's write path says (the outbox, carried by `hippo ship`; from a linked worktree, that worktree's own corpus dir); before it, all four estate repos that took v1.45.0 had the tracked file in the main checkout written"
    - id: NAT-3
      title: "A floor diet before a floor channel"
      size: M
      release: "v1.45.0"
      status: done
      deps: [GAT-3, HOT-7]
      ruling: V2Q-23
      note: "built in v1.45.0: with `budgets.floor_bytes` declared, tend's floor kind proposes one demotion at a time, ranked by lane and use, each with the trim-safety replay. Skyline 8,780 -> 8,050 B and a smaller sibling 17,418 -> 8,136 B with 0 lost hits. On emgl the proposals reach 8,137 B once bare-name floor pointers are read, which the same release adds. v1.46.2: a pointer whose memory is younger than the span the usage ledgers hold (never less than seven days) waits instead of ranking as least used, and the diet runs to the budget less a headroom (a sixteenth, or `budgets.floor_headroom_bytes`) so the next floor pointer still passes the gate. On a copy of emgl's corpus with its prompt history: 103 proposals ending at 8,152 B with 23 new memories among them, then 118 ending at 7,601 B with none"
    - id: NAT-4
      title: "Census flags native memory that belongs to no corpus"
      size: S
      release: "v1.43.0"
      status: done
    - id: RUL-8
      title: "Conflicts between what a memory says and what a rule says"
      size: M
      release: "v1.45.0"
      status: done
      ruling: V2Q-26
      note: "built in v1.45.0: a deterministic text leg into the tend contradiction kind. The handed-over conflict is listed on emgl. Missed: its copy in a second corpus, which carries no rule to compare against"
    - id: RUL-9
      title: "Promote-to-rule as a tend proposal"
      size: S
      release: "v1.45.0"
      status: done
      deps: [TND-2]
      note: "built in v1.45.0: a `rule` tend kind; 1 proposal on emgl at 100% coverage, none on hippo or Skyline"
    - id: RUL-10
      title: "A floor line that restates a rule"
      size: S
      release: "v1.45.0"
      status: done
      note: "built in v1.45.0, informational: 0 / 2 / 4 floor lines reported on hippo / emgl / Skyline, all true on hand review"
    - id: PLT-3
      title: "Two platform receipts"
      size: S
      release: "v2.0.0"
      status: planned
      note: "not run: the probes need a logged-in claude CLI on the machine, and it was still logged out on 2026-11-13; a probe script is prepared. It gates NAT-2 and HOT-12, so it moves to v2.0.0 with NAT-2"
    - id: RWY-6
      title: "Writers clean up after themselves"
      size: S
      release: "v1.43.0"
      status: done
      note: "both halves: writers remove the tmp files a killed process left, and setup offers the old worktree copies one directory per yes"
