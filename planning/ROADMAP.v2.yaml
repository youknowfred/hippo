# ----------------------------------------------------------------------------
# Amendment 2: recall performance on the estate (ROADMAP.v2.amendment-2.md).
# RATIFIED 2026-11-13 under the owner's delegation ("prioritize directions that drive
# memory performance for our group of repos, then ratify as you recommend"). Its items
# keep their own block, like amendment 1's.
amendment_2:
  design_record: ROADMAP.v2.amendment-2.md
  status: ratified
  proposed: 2026-11-13  # at v1.45.0
  ratified: 2026-11-13
  items:
    - id: OUT-5
      title: "Consent for bytes a session wrote on this machine"
      size: L
      release: "v1.46.0"
      status: done
      deps: [OUT-1, GAT-1]
      ruling: V2Q-29
      note: "built in v1.46.0 as an opt-in (consent.session_writes, honoured after hippo trust policy --accept). Gate on scratch copies of emgl: 0 of 4 withheld after native-path and repo-path Writes and Edits of consented files; the trust file byte-identical with the key off; pulled bytes and an Edit of an unconsented file still withheld. The hook-cost bound was measured only under load (missed as measured). An adversarial pass bound the note to its tool call, excluded subagent writes and held lint-flagged bytes"
    - id: HOT-13
      title: "Journals admitted by their own signal"
      size: M
      release: "v1.46.0"
      status: done
      deps: [HOT-7, HOT-8]
      ruling: V2Q-28
      note: "built in v1.46.0: the first fused candidate, when it is a journal with evidence of its own, is served beside the prompt's rows (at most one). emgl 52/105 -> 55/105 (gate 0.52; 0.495 on a later copy), Skyline 15/25 -> 17/25, hippo unchanged; journals 1.2% / 3.1% of served rows. HIPPO_JOURNAL_SIGNAL=0 turns it off"
    - id: HOT-14
      title: "Characters per prompt"
      size: M
      release: "v1.46.0"
      status: done
      deps: [HOT-8]
      ruling: V2Q-32
      note: "built in v1.46.0, hook only: emgl 1,455 -> 982 characters per injecting prompt (gate 1,000), Skyline 1,296 -> 888, hippo 1,456 -> 989; hard sets unchanged; no visible name lost. HIPPO_HOOK_COMPACT=0 restores the block"
    - id: OWN-4
      title: "A promoted lesson keeps its place at home"
      size: S
      release: "v1.46.0"
      status: done
      deps: [OWN-2]
      ruling: V2Q-28
      note: "built in v1.46.0: the fused index laid its dense rows out wrong for every tier after the first (a promoted lesson's description vector was scored as a body chunk), and a promote put an on-demand lesson on the user tier's floor. After the fix, ten promoted probe lessons keep their explicit rank and fused score at home (10/10, was 3/10)"
    - id: OWN-5
      title: "Promotion proposals for a lesson with no twin"
      size: M
      release: "v1.46.0"
      status: planned
      deps: [OWN-2, OWN-4]
      ruling: V2Q-30
      note: "built and measured, not shipped: siblings gained 0 of the ten probe answers against a bar of 5. 66 lessons qualify on emgl, 6 of the ten probes among them; the telemetry window spans three days, so every qualifier ties at three and the first twelve proposed held none of the probes. Re-measure when the window is longer"
    - id: HOT-15
      title: "Speed on the largest corpus"
      size: M
      release: "v1.46.0"
      status: done
      deps: [HOT-11]
      ruling: V2Q-28
      note: "built in v1.46.0: one query embedding per explicit recall, one bounded history walk per staleness scan (emgl 67-210 s -> 1-12 s cold, the same 659-660 verdicts) and per-process memos for the hook. Explicit recall p50 on emgl, interleaved, quiet machine: v1.44.0 249 ms, v1.45.0 447 ms, v1.46.0 261 ms (gate: within 20 ms of v1.44.0; under heavy load the same pair read 105-157 ms apart). Warm hook p50 278 -> 150 ms. Results byte-identical on three corpora"
  owner_rulings:
    - id: V2Q-28
      question: "Which directions, in what order"
      ruling: "withheld memories, journals, characters per prompt, lessons between repos, speed, then the signals the gates are read through"
      status: ratified
    - id: V2Q-29
      question: "What replaces OUT-4"
      ruling: "(b) consent for bytes a session's own file tool wrote into a trusted corpus, opt-in by a consented key"
      status: ratified
    - id: V2Q-30
      question: "Promote a lesson that has no twin"
      ruling: "yes, when it cites no repo path and was served or used on three or more distinct days; at most three per listing"
      status: ratified
    - id: V2Q-31
      question: "The dense floor default"
      ruling: "stays 0.60; no swept floor applied automatically"
      status: ratified
    - id: V2Q-32
      question: "May the prompt hook shorten a description"
      ruling: "yes, at a word boundary, in hook mode only"
      status: ratified
    - id: V2Q-33
      question: "What is not in this release"
      ruling: "TND-4, PLT-3, NAT-2's channel, the v2.0.0 format and removal items, the seven STABILITY.v2.md questions"
      status: ratified
    - id: V2Q-34
      question: "The release"
      ruling: "v1.46.0 prepared ahead on the rehearsed tree; an item that misses its gate is not shipped; merges and tags wait for the owner"
      status: ratified
