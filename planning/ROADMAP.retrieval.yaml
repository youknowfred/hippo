      - id: HCR-7
        title: One embedder per machine — a shared MLX daemon behind the dense seam
        priority: P0
        effort: L
        status: done            # 2026-11-27: ships in v1.50.0. EMB-1/EMB-2's daemon on main, with HCR-7's fallback and evidence ported onto it (eighth ruling); default ON since EMB-1; acceptance stamp 1 missed, and the owner ruled it stays the default (ninth ruling)
        gated_on: [HCR-2]
        problem: >-
          Each session's warm server loads its own copy of the high embedder
          and never unloads it. Measured 2026-11-26 on the owner's 128 GB Mac
          (MLX 0.32.5, two scratch processes on the pinned 4B snapshot): 4.12
          GB phys_footprint per process, 3.96 GB of it dirty Metal memory
          (IOAccelerator), mapped file 416 KB — mx.load copies the weights, so
          nothing is shared between processes; ~0.5 GB more of transient MLX
          buffer cache after queries. With both loaded the system's free memory
          fell 9.9 GB. Ten sessions cost 41 GB, 25 cost 103 GB, and 31 exceed
          the machine. The owner routinely runs ten or more sessions and fleets
          of siblings.
        design: >-
          A per-user daemon that hippo spawns lazily and owns the one MLX
          thread: a unix socket under CLAUDE_PLUGIN_DATA (mode 0600), named by
          space id + pinned weights revision + plugin version so sessions on
          different versions never share a mismatched space. It serves
          embed(texts, kind) and rerank(pairs). embed_mlx.BACKEND (already the
          seam: (model, dim, snapshot_dir) -> embedder) gains a remote embedder
          with the same embed/query_embed shape, so build_index and recall are
          unchanged and a warm server on high never imports MLX. Spawn is
          serialized by a lock file (two sessions starting at once must not
          load two copies). The daemon exits when no live warm heartbeat
          remains, and drops the model after an idle window (measured: unload
          returns the process to 166 MB; reload from a warm page cache 306-332
          ms, first query after it 780-840 ms). Queued queries batch into one
          forward pass; a build's document slices keep today's rule that a
          query waits one slice, now across sessions. The fallback contract is
          unchanged: daemon absent, starting, slow or killed mid-call means
          that prompt serves lean, and nothing raises or blocks a prompt.
        implementation_notes: >-
          embed_mlx.BACKEND / high_embedder / mlx_executor, rerank_mlx's
          loader, recall_warm_high._run (the loader thread becomes "ensure the
          daemon, then keep high/ caught up") and status() (resident_bytes and
          load_ms now come from the daemon), recall_warm.server_states (the
          liveness source for the daemon's exit), build_index.run_bounded /
          DENSE_QUERY_TIMEOUT_SECS, embed_mlx.abandon_on_timeout (an abandoned
          call must be droppable across the socket too). A slow daemon must
          degrade the one call to lean WITHOUT tripping the session's breaker
          (SERVE_BUDGET_MS 1500; a trip is permanent for the session). Toy
          measurement 2026-11-26 (unbatched, one forward per query, load
          average 13): one client p50 101 ms / max 266 ms, same as in-process;
          10 simultaneous queries max 1.35 s, 25 max 3.95 s, 50 max 6.66 s —
          so batching, or a client bound below the budget, is required and is
          NOT yet measured. Batched and single forwards may differ in the last
          float bits; the acceptance below decides whether batching ships.
        acceptance: >-
          Ten warm servers on high hold ONE copy of the model
          (footprint-stamped: each server under 0.2 GB, the daemon ~4.6 GB);
          vectors byte-identical to the in-process embedder on the golden set,
          so HCR-3's calibration carries over with no re-run (if batching
          breaks byte-identity, queries run unbatched or the floor is
          re-checked); QUA-6 counts unchanged against the in-process arm;
          daemon absent, slow, or killed mid-call serves lean with no breaker
          trip and no raised error; warm served recall stays inside
          SERVE_BUDGET_MS at a measured burst of 10 simultaneous prompts; two
          sessions starting together spawn one daemon; a dated evidence file
          before the daemon becomes high's default path, carrying the F3 arm
          (the 8B with the warm reranker, read in hook mode); the four F1
          conditions hold as built (no install step or launchd entry, no
          port, lean on any daemon fault, a doctor line).
        incident_2026_11_26: >-
          The same day, with the owner's Mac on high, its memory ran out. The
          system log holds no memory-kill entry, so the cause is read from what
          was left: a high/ build over a 1,054-memory corpus (2,658 body
          chunks) had started 12 minutes before and never finished; MLX's
          buffer cache was uncapped (default limit 121.6 GB on this machine);
          and a bounded scratch run of the same slices on the 4B put 6.4 GB in
          that cache after five slices, still climbing. HCR-2's bench ran on a
          108-memory corpus and its "about 0.5 GB of transient cache" (this
          item's problem, above) holds for queries only. Fixed outside this
          item: embed_mlx.cap_mlx_cache (HIPPO_MLX_CACHE_MB, 512 MB default)
          before either loader's first buffer; at 256 MB and at 1 GB the build
          ran at the same speed, a query took 56-62 ms, and the process held
          4.6 and 5.5 GB. The daemon inherits the cap. Not traced: the same
          morning one small corpus's high/ matrix was rewritten ten times in
          five minutes, so the catch-up loop re-embeds more than it should;
          and a build's peak (5.2 GB active on a 1,024-token slice) is paid by
          every server that builds until the daemon owns builds. The owner's
          machine went back to lean until the cap ships.
        as_built: >-
          2026-11-27, in three steps. (1) EMB-1 (#260) and EMB-2 (#261), from
          another session, not written to this item: embed_daemon.py is both
          the process (python -m memory.embed_daemon --socket <path> --detach)
          and its clients (DaemonEmbedder, DaemonReranker), handed out by
          embed_mlx.BACKEND and rerank_mlx.BACKEND. A lifetime flock; a 0600
          socket in a 0700 directory under CLAUDE_PLUGIN_DATA/embedd, keyed by
          a hash of the embedding code (not by space, weights revision and
          plugin version, as the design said: one daemon serves every space
          that code can); one document request at a time, so a query waits one
          slice of one build; exit after 900 s without a load, embed or rerank
          (not on warm heartbeats, and with no separate model drop); a client
          whose call fails reads as not loaded and the hippo-high thread
          revives the daemon. It was made high's default path on merge, with
          README and STABILITY text naming the in-process switch, before any
          evidence file existed. As merged, the first prompt after the daemon
          went (every idle exit) attempted high and was served BM25 over the
          high index; a query could wait the dense lane's 5 s, past
          SERVE_BUDGET_MS; and a build went 32 texts per request. (2) HCR-7
          was built in parallel to the sixth ruling as #262, with its own
          daemon; closed unmerged on the eighth ruling. (3) The port, this
          change, onto main's daemon: a served call asks DaemonEmbedder.ready
          (150 ms) last in _plan and is lean when the daemon is gone or
          holds no model; its query waits at most 0.75 s and carries that wait
          (wait_ms), the daemon refuses at once a query it cannot finish in
          time (queries ahead times the recent pass time) and never runs one
          whose wait ran out while it queued (a turn lock, and
          embed_mlx._GIVEN_UP for a query behind a build's slice);
          recall_warm._serve_warm gives the high attempt a collecting defer
          and an embed_daemon.attempt mark, and on a fault discards the
          attempt with its queued telemetry and serves the prompt again with
          no plan, the daemon's time kept off the breaker; after a wait paid
          for nothing the server holds high off 4 s, doubling while it
          repeats; a build pass is one request, so the daemon cuts the
          in-process slices, and a build whose session hung up stops at its
          next slice. Not ported from #262, because main's daemon already
          answers them its own way: heartbeat reaping, the space-and-version
          socket key, coalescing (never built on main; measured not
          byte-identical and no faster). (4) An independent check of the port
          by a second session, the same day, added two things it found short
          of the ruling: a served prompt's rerank ends with the prompt's
          attempt, as its query embed does (each had its own bound, 0.75 s
          and 0.8 s, together past the 1.5 s budget; only with
          HIPPO_RERANK=1), and doctor's retrieval-profile line asks the
          daemon on its socket (not running, running with nothing loaded, or
          what it holds), where it had named the daemon only through a warm
          server's heartbeat. It also found six of the port's fault tests
          erroring at setup on Linux, never run there (two fixtures made one
          directory once the socket path was short enough to sit under it),
          and fixed the fixture. Tests: tests/test_embed_daemon_faults.py
          (14), tests/test_embed_daemon_gaps.py (8: six written against main
          before the port, five of which failed there, and two for the
          check's changes) beside
          EMB-1/EMB-2's tests/test_embed_daemon.py (15).
        ab_result: >-
          planning/HCR-7.evidence.2026-11-27.json, taken after the port, on
          main's daemon as ported (bench/embed_daemon.py,
          bench/space_calibration.py; real models; scratch copies; the owner's
          sessions running beside it, load average 2.9 to 7.0 for the timed
          server run). Re-measured there unless marked. (1) One copy: ten real
          MCP servers on high 0.37 to 0.38 GB each (phys_footprint), the
          daemon 4.70 GB, all eleven 8.5 GB where ten in-process servers held
          41 GB; no server maps an MLX library. The stamp "each server under
          0.2 GB" does NOT hold: ten lean warm servers with no daemon measured
          0.29 to 0.31 GB (not re-measured), so no warm server can meet it.
          (2) Bytes: 228 of 228 queries byte-identical to the in-process
          embedder one at a time [0.983, 1], 228 of 228 with ten arriving at
          once, 567 of 567 index rows built through the daemon, each pass one
          request [0.993, 1]. Why one request: what shares a forward pass
          changes a vector's last bits (in-process, not re-measured: 0 of 228
          queries identical in batches of ten, raw components moving up to
          1.4e-4 on a norm of about 128; 0 of 4 identical even with no
          padding). (3) QUA-6: every rank equal to the in-process arm on 228
          rows, explicit and hook (golden 18/18, packs 32/32, hippo 89/98,
          corpus-b 79/80; hook 18, 30, 76, 10), and equal to the v1.49.0
          release run. (4) Faults, 30 prompts each, all served lean, none
          raised [0, 0.11], no breaker trip: daemon killed then every server
          prompted at once, slowest 242 ms; its query turn held for seconds,
          23 refused at once and 7 timed out, p95 825 ms [814, 830]; killed
          with the prompt's query waiting in it, slowest 409 ms, and the
          servers revived it themselves all 33 times. (5) Burst, 300 prompts
          (ten at one instant, thirty times): none over SERVE_BUDGET_MS [0,
          0.013], median 192 ms [173, 214], p95 874 ms [740, 891], slowest
          1,154 ms; 106 served high [0.30, 0.41], the rest lean (97 refused at
          once by the daemon). (6) One daemon from two simultaneous starts,
          20 of 20 [0.84, 1]; one from ten servers' simultaneous first
          prompts. (7) The F3 arm, in-process, not re-measured: 228 on-topic
          rows of four corpora, each space's committed thresholds. In hook
          mode the 8B with the warm reranker finds 135 against 134 for the 4B
          as shipped (+0.004 [-0.022, +0.031]) at MRR 0.491 against 0.476
          (+0.015 [-0.022, +0.054]): not resolved. The 8B alone: 135, MRR
          0.469. The 4B with the reranker: 137, MRR 0.485 (+0.009 [-0.026,
          +0.045]). In explicit mode the 4B's whole rows lead the 8B, 218
          against 213, MRR +0.033 [+0.006, +0.061]. Nothing in it re-reads
          "Keep the 4B", and no default changed. (8) No internet socket open
          in the daemon, one unix socket at 0600 under the data dir, nothing
          installed; with its idle exit set to 60 s for the run it left by
          itself 47 s after the last server. CHECKED the same day by a second
          session (planning/HCR-7.verification.evidence.2026-11-27.json), on
          the branch with the check's two changes. The server run taken
          again agrees on every count: one copy, the daemon 4.70 GB to the
          megabyte, servers 0.32 to 0.39 GB (three read 0.32, seven 0.37 to
          0.39), none raised, no trip and none over budget in 300 burst
          prompts [0, 0.013] and in 30 of each fault [0, 0.11], all 90 fault
          prompts lean, 20 of 20 starts one daemon, 33 of 33 kills revived by
          the servers; burst median 116 ms [107, 127], p95 795 ms [708, 825],
          slowest 990 ms, 113 served high, at a lower load average (3.8 to
          4.8). Ten lean warm servers re-measured on the port's code: 0.29 to
          0.30 GB. Main's daemon before the port, built with real weights:
          182 of 187 rows byte-identical to in-process [0.939, 0.989] (five
          golden rows differ in their last bits); the port, 187 of 187. The
          warm reranker through the daemon, not run before: 180 of 180 scores
          identical to in-process [0.979, 1], the daemon holding the reranker
          alone (0.57 GB). The three carried sets (the 8B arms, the
          in-process arms, the lean servers) hold as carried: the model
          classes, the scoring function and every recall, ranking and index
          file are the same bytes on the branch as where they ran.
        open_for_owner: >-
          2026-11-27: (1) and (2) are RULED, (3) is OPEN, (4) lists the
          builder's calls for the owner to overturn.
          (1) The default: RULED 2026-11-27, ninth owner ruling ("Keep it
          default"): the daemon stays high's default path with the 0.2 GB
          figure missed. What was put: the acceptance asked for a dated evidence file
          before the daemon became high's default path; EMB-1 made it the
          default first. The evidence, taken after, holds on seven of eight
          points and misses one stamp of point 1: a warm server holds 0.37 to
          0.38 GB with the daemon, not "under 0.2 GB". That figure left out
          what a warm server holds on every profile (0.29 to 0.31 GB on lean);
          what the item is for, one copy instead of ten, holds (8.5 GB against
          41). Read as written, the default goes back off; read as an
          estimate, it stands. (2) The sixth ruling's F2 said the in-process
          embedder stays an UNADVERTISED knob; main's README, engine README
          and STABILITY named HIPPO_EMBED_DAEMON=0. RULED 2026-11-27, tenth
          owner ruling ("Take it out"): taken out of those three; the knob
          works as before and bench/README.md keeps it for the benches. (3) The
          daemon leaves after 900 s idle, not when no warm heartbeat remains:
          it outlives its sessions by up to 15 minutes and leaves under live
          quiet ones (the next prompt is lean while it reloads, about 2.5 s).
          Left as merged. (4) Three calls from building the port: the 0.75 s
          wait for a query vector (a slice of a build is about 0.76 s; longer
          serves more prompts high during a build and makes a fault's prompt
          slower); the 4 s doubling hold after a wait paid for nothing; and in
          a sustained burst most prompts are served lean (106 of 300 high),
          because the daemon's pass-time estimate is deliberately quick to
          recover. (The port merged as #264 and shipped in v1.50.0; before
          it, a slow daemon could hold a served call past the breaker's
          budget.) The sixth ruling's three calls, as ruled
          2026-11-26 ("as recommended on all three"): (1) The daemon fits the
          no-server posture on four
          conditions, each binding on the build: hippo spawns and reaps it
          (lazy spawn; no install step, no launchd entry); a 0600 unix socket,
          no port; recall never depends on it; high only, and doctor names its
          state. (2) The in-process embedder stays as an unadvertised knob
          (benches, the byte-identity check, and the daemon's own loader) and
          is never the fallback: the fallback is lean. (3) "Keep the 4B" is
          not re-read on memory alone; the evidence run adds one arm, the 8B
          with the warm reranker in hook mode, and no default changes without
          that file.
        not_chosen: >-
          Weighed 2026-11-26. Idle unload per server alone: saves nothing when
          a fleet is all prompting, and a cold-disk reload (2-5 s) must serve
          lean. A cap on how many servers hold the model: the rest serve lean,
          a quality loss. Smaller quantization: a different embedding space, no
          arm in any HCR evidence file, owes a full HCR-3 calibration and an
          HCR-6 bench, and halves the cost at best. MRL truncation: shrinks the
          index, not the model — no memory saved. Sharing weight pages between
          processes: not available, mx.load copies into private Metal buffers.

      - id: HCR-8
        title: A held-out eval that can resolve high against lean, and its ablations
        priority: P0
        effort: M
        status: done            # 2026-11-26: bench + counts-only evidence (#257); no shipped default changed
        gated_on: [HCR-6]
        problem: >-
          HCR-6's 38 rows could not tell high from lean (31 against 33), and
          the owner's read was that high was under-optimized. Nothing said
          which knob moves it.
        as_built: >-
          bench/high_eval_set.py, high_eval.py, high_eval_report.py,
          rerank_latency.py. 347 questions over three corpora (hippo's own and
          two private ones of 110 and 1,070 memories), each written from one
          memory with no retriever in the loop, gold checked by blind pooled
          judging. Every number carries a 95% interval.
        ab_result: >-
          planning/HCR-8.evidence.2026-11-26.json. lean 286 of 347, high as
          shipped 303 (+0.049 [+0.012, +0.089]), lean + the 0.6B reranker over
          30: 306. The query instruction, the dense floor and the fusion weight
          move nothing. The document text is the largest lever: whole-memory
          rows take the 4B 303 -> 320 and lean 286 -> 307. The MMR re-cut costs
          hits on both (off: lean 302, 4B on whole rows 335), on a set with one
          target per question that cannot score what the re-cut is for. The 8B
          ties the 4B wherever recall() serves. Not measured: lean with both
          changes together; abstention and injection volume on the changed
          rows. HCR-9 took both up.

      - id: HCR-9
        title: Whole-memory rows for the 4B, its space re-measured, the MMR re-cut rescaled
        priority: P0
        effort: L
        status: done            # 2026-11-27: built on the seventh owner ruling; ships in v1.49.0
        gated_on: [HCR-8]
        problem: >-
          HCR-8 found what moves high (the text an entry row embeds, and the
          MMR re-cut) but changed nothing: whole rows are another cosine
          distribution than the one HCR-3 calibrated, the re-cut had only been
          measured by what it costs, and the two changes had never been run
          together on lean, so the real margin was unknown.
        design: >-
          The seventh ruling's six steps, in order. One table says which
          models' entry rows embed the whole file
          (build_index_dense.WHOLE_ROW_MODELS); a model joins it only with its
          own calibration run, so the row text and the thresholds move
          together or not at all.
        as_built: >-
          2026-11-27. (1) The index: an entry carries row_hash (sha1 over the
          whole file) beside its doc_text hash; in a listed space the entry row
          embeds the whole file (cut at the embedder's 1,024 tokens), the
          manifest records row_text "whole", and rows are reused on row_hash.
          No schema bump: a lean manifest gains the key at its next refresh with
          every row reused, and a twin built on description rows is not served
          (recall_warm_high.fresh) until its entry rows are re-embedded; its
          body-chunk rows are reused. BM25, the description on display and
          every lean row are untouched. (2) The twin build, because whole rows
          double it (about 36 minutes for 1,070 memories, unloaded): one
          builder per twin across sessions (a flock on high/.build.lock; ten
          sessions used to embed one corpus ten times at once), and each pass
          embeds at most 256 rows and persists them, so a session that ends
          mid-build costs one pass. (3) The 4B's space re-measured on whole
          rows over five corpora (bench/space_calibration.py): floor 0.42 ->
          0.44, gate 0.60/0.60 kept, count rule 0.12/0.14 kept, band default
          kept. (4) The MMR re-cut: its relevance term was the raw fused score
          (about 0.02) against a cosine (about 0.7), so lambda 0.8 weighed
          diversity about nine to one. Relevance is now scaled to the pool and
          lambda is 0.4 (bench/mmr_eval.py), on every profile.
        ab_result: >-
          Four files, all 2026-11-27, every comparison with a 95% interval.
          HCR-9.tuned-lean.evidence: tuned lean (whole rows, re-cut off) 317 of
          347 against tuned high 335; the margin is +0.052 [+0.023, +0.081]
          hits and +0.053 [+0.025, +0.081] MRR, all of it on paraphrased
          questions, so G1's stop did not fire. HCR-9.mmr.evidence: 274
          re-captures of 75 questions' targets and strongest wrong competitors.
          The v1.48 re-cut removed duplicates (-0.75 and -1.21 competitor rows
          of the top 10, lean and high) and lost right answers even there
          (hit@5 -0.107 [-0.187, -0.027] and -0.080 [-0.147, -0.027]); on the
          corpora as they are it cost -0.046 [-0.075, -0.020] and -0.043
          [-0.069, -0.017] hits. Pool-scaled at 0.4 loses nothing resolved
          against the re-cut off (lean 302 = 302, high 336 against 335 of 347)
          and still takes a triplicated fact's rows in the top 5 down by 0.51
          [0.35, 0.68] on high and 0.20 [0.11, 0.29] on lean. 0.3 costs the 4B
          a resolved 1.2 points of hit@5. HCR-9.calibration.evidence: on whole
          rows the generic off-topic ceiling is 0.433 (was 0.402) and the lowest
          on-topic best still 0.495; the floor decides little (481 to 484 of
          539 on-topic rows from 0.30 to 0.50, the same abstentions at every
          floor with the gate on). As released, high against lean on the same
          539 rows: explicit 482 against 438, hook 369 against 324; injecting
          replayed prompts 225 and 219 against 227 and 211; rows per injecting
          prompt 8.7 against 5.3 and 5.5. HCR-9.release.evidence: high as
          released 336 of 347 (MRR 0.774), lean as released 302 (MRR 0.684);
          the released margin is +0.098 [+0.066, +0.133] hits, +0.090 [+0.061,
          +0.122] MRR. lean against its v1.48 self: +0.046 [+0.023, +0.072].
        open_for_owner: >-
          Three calls made by the builder inside the seventh ruling, each with
          the evidence and what would overturn it. (1) lean keeps description
          rows. G2 said "for lean too if G1 supports it", and G1 does for plain
          recall (whole rows on top of the re-cut off: +0.043 [+0.014, +0.072]).
          The calibration run says it does not for what lean serves on every
          prompt: in hook mode whole rows read 320 of 539 against 316, with the
          same abstentions and replay volume. And every machine would pay: a
          full re-embed at 512 tokens a memory (an unbudgeted build of the
          1,070-memory corpus took 1,209 s against 409 s, at 11 GB), behind a
          15-second SessionStart budget that would leave a large corpus on BM25
          for many sessions, plus LIF-2's duplicate thresholds, which are
          calibrated on description rows. To adopt it: add bge-small to
          WHOLE_ROW_MODELS with a schema bump, a bounded-memory build, and
          new_memory's duplicate check re-measured. (2) The MMR re-cut is
          rescaled, not turned off. Off is the simpler reading of HCR-8; 0.4
          pool-scaled is within every interval of off and keeps part of what
          the re-cut is for. HIPPO_MMR_LAMBDA=1.0 is off. (3) The 4B's count
          rule stays 0.12/0.14, HCR-3's no-row-lost rule: it serves 8.7 rows
          per injecting prompt where lean serves 5.3 and 5.5. wide 0.26 serves
          lean's volume (5.4 and 5.7) and finds 359 rows in hook mode against
          369; 0.18 finds 363 at 7.3 and 7.6. Volume against rows found is the
          same call the owner made for lean on 2026-11-25 ("Leave it").
        found_at_install: >-
          2026-11-27, installing v1.49.0 on the owner's Mac with six projects.
          recall_warm_high._plan returned no plan on any of them: each has an
          empty private tier (.claude/memory.local as `hippo init` leaves it)
          whose index has no entries and so can never have a dense-ready twin,
          and the plan required one of every tier. Recall itself skips an empty
          tier. So since v1.48.0 a warm server on high loaded the model, kept
          its twins level and served lean on every prompt, wherever the private
          tier was empty. Every measured high number stands (the benches hand
          recall the high index directly); what did not hold is that the
          profile was serving them. Fixed in v1.49.1: the plan and the catch-up
          loop skip an empty tier. This is likely much of why high read as
          under-optimized to the owner before HCR-8. What is still missing is a
          bench that drives the warm server's own plan with real models.
        not_done: >-
          The 8B keeps description rows and its HCR-3 entries: it was not
          re-run, and HCR-8 has it tied with the 4B. Abstention on adjacent
          technical probes is still behind lean on hippo's corpus (8 of 12
          against 11) and on a large corpus's own probes (12 of 20 against
          15), as it was on description rows. The warm reranker was not
          re-read on whole rows (it is off by default).

