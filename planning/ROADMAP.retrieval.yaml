workstream:
  - id: HCR
    name: High-ceiling retrieval profile (Qwen3 dense + rerank via MLX, PPR lane)
    extends: >-
      resolve_embed_model/_DENSE_FLOOR_BY_MODEL/IDX-1 manifest binding (model-id
      seam), HOT-6 warm server (big-model amortization), RCL-5/RET-16 rerank
      seam, GRA-1 expansion in recall_graph.py, ab_runner + GRF-4 + QUA-6 (gates)
    goal: >-
      Let a 128 GB Mac spend its ceiling on recall quality — a 2025-class
      instruction-aware embedder and a modern reranker riding the warm server —
      while every machine below the bar keeps exactly today's lean/floor
      behavior, and the graph lane gets the HippoRAG-2 associative upgrade for
      free on all profiles.
    items:

      - id: HCR-1
        title: Profile plumbing — retrieval_profile config, setup offer, doctor surface
        priority: P0
        effort: S
        status: done            # 2026-11-25: 91aedf1 — memory/retrieval_profile.py, `hippo setup --profile`, doctor's retrieval_profile line
        problem: >-
          There is no named tier between "the one embed model" and the BM25
          floor; the high profile needs a durable, per-machine switch that
          composes with (not replaces) HIPPO_EMBED_MODEL.
        design: >-
          A retrieval_profile key (floor|lean|high, default lean) in the same
          bootstrap config file that carries embed_model; HIPPO_RETRIEVAL_PROFILE
          env override with the resolve_embed_model precedence shape (env >
          config > default); `hippo setup` offers high on arm64-darwin with
          sysctl hw.memsize >= 64 GiB (an OFFER at setup, never a silent flip);
          a doctor check states the active profile, its models and their cache
          state. HCR-1 ships the switch with high resolving to lean's models —
          later items hang real models off it, so the item is shippable alone.
        acceptance: >-
          Profile resolves by the documented precedence everywhere models are
          chosen; doctor names it; setup offer appears only on qualifying
          hardware; all three profiles green on the existing suite.

      - id: HCR-2
        title: MLX embedder backend — Qwen3-Embedding-4B (8B knob) behind the dense seam
        priority: P0
        effort: L
        status: done            # 2026-11-25: youknowfred/hippo#235 — memory/embed_mlx.py + recall_warm_high.py; measured on the real 4B (implementation_notes); the 8B loads since #240
        gated_on: [HCR-1]
        problem: >-
          bge-small-en-v1.5 (2023, 384-dim, ~512-token budget) is the quality
          ceiling of the dense lane; fastembed 0.7.4's in-family headroom tops
          out at 2024-class or wrong-license models (jina-v3 is CC-BY-NC).
        design: >-
          An MLX runner (high-profile-only optional dependency, its own
          requirements extra; never imported on lean/floor) implementing the
          embed seam (document embed at build, embed_query at recall) for
          Qwen/Qwen3-Embedding-4B (default) and -8B (knob), Apache-2.0,
          instruction-aware — the query side carries a fixed task instruction.
          Warm-first posture: only the HOT-6 warm server loads the model; the
          spawn hook never does and serves the LEAN index (the existing claim
          protocol already arbitrates). Per-profile index: IDX-1's manifest
          already binds model id + matrix, so lean and high indexes coexist
          without tearing; MRL truncation (native 2560 vs 1024/2048) is decided
          by the HCR-6 bench, recorded in the manifest. Offline posture
          mirrors OSP-4: stat-check the model cache BEFORE import; cold cache
          degrades to lean, never downloads at recall time.
        implementation_notes: >-
          build_index.resolve_embed_model, _MODEL_CACHE_REPOS (OSP-4 pattern),
          build_index_dense (IDX-1 binding), recall_warm SERVE/COLD budgets,
          recall_rank.embed_query/run_bounded. 8-bit 4B ≈ 4 GB disk / resident
          RAM in the warm server; 8B ≈ 8.5 GB — estimates, bench-stamped in
          HCR-6. MEASURED 2026-11-25 (bench/high_embed.py, owner's 128 GB
          M-series Mac, hippo's own corpus: 108 memories + 272 body chunks;
          4B mxfp8, full 2560 dims): weights 4.16 GB download; cold load
          1.0-2.2 s in a background thread (off the serving path); 3.86 GiB
          MLX-resident (process RSS +3.8 GB); high index built in ~100 s
          (~1,350 tok/s); query embed ~80 ms warm; warm served recall end to
          end median 309-464 ms, max 619-851 ms of the 1500 ms budget (every
          call embedding with the 4B), falling to median 114 / max 181 ms with
          OPENBLAS_NUM_THREADS=1 — the excess is OpenBLAS's thread pool beside
          Metal in MMR and the dense matmul, not the model.
        acceptance: >-
          High profile builds its own bound matrix; warm recall serves dense
          hits from the 4B model inside SERVE_BUDGET_MS on the owner's machine
          (measured, not assumed); spawn path untouched (lean index, 300 ms
          gate still green); cold-cache and no-MLX environments degrade to
          lean with a doctor note, never an exception.
        as_built: >-
          2026-11-25. embed_mlx is the embedder (HIGH_MODELS: the 4B default,
          the 8B by HIPPO_HIGH_EMBED_MODEL or the preset; one MLX thread for
          the process); recall_warm_high keeps the `high/` index beside the
          lean one and serves from it once it has caught up; the spawned hook
          never loads it. The two questions the design left to the bench are
          closed: MRL width stays native (HCR-6: neither 1024 nor 2048 adds a
          hit over the full width), and the estimates are measured (4B: 4.15
          GB resident, 1.9 s load; HCR-6's cost block). The 8B knob could not
          load until #240 (its conversion ships no lm_head.weight; the
          embedder now loads every model with no head).

      - id: HCR-3
        title: Floor recalibration for the Qwen3 embedding space
        priority: P0
        effort: S
        status: done            # 2026-11-25: 4B and 8B calibrated at full width (floor, gate, count rule; band unchanged) — planning/HCR-3.evidence, HCR-3.count.evidence, HCR-3.8b.evidence (all 2026-11-25). Truncated widths are uncalibrated on purpose (HCR-6 kept the native width)
        gated_on: [HCR-2]
        problem: >-
          The RET-1 floor is calibrated per model; an uncalibrated model id
          falls to the conservative 0.50 default, which is a guess in a space
          whose cosine scale nobody measured — and Qwen3's instruction-aware
          query side shifts the distribution.
        design: >-
          Re-run the RET-1 method verbatim (QUA-6 golden hard-set on-topic
          queries vs clearly-off-topic probes, warm real model, floor set to
          the low side of the separation gap) for 4B and 8B with the
          production query instruction; add both to _DENSE_FLOOR_BY_MODEL with
          the calibration recorded in the commit body; re-check the HOT-10
          soft band width against the new space's near-floor density.
        acceptance: >-
          Off-topic probes abstain, hard-set recall at or above lean's on the
          golden corpus, floors landed as table entries with dated calibration
          evidence.
        hook_mode_findings: >-
          2026-11-25, planning/HCR-3.hook-gaps.evidence.2026-11-25.json: the
          three things HCR-3.count.evidence recorded and did not explain,
          traced stage by stage through the real hook. Diagnosis only; no
          table entry is changed. (1) Hook mode reads 26/38 on the live corpus
          against 31 to 34 in explicit mode because 7 of the 38 rows expect a
          memory on the always-loaded floor, which the hook collapses onto one
          line and never gives a row. Counting those as found: lean 32/38,
          4B 33/38, 8B 33/38. Gate, lanes and render budget cost no row. (2)
          High injects on 271 of 300 replayed prompts against lean's 229
          because the 4B gate's `support` (0.46) sits 0.04 over the floor, so
          nearly any memory both lanes rank corroborates a prompt. Strong 0.60
          with support 0.56 gives 230, 0.60/0.60 gives 227, and no cell
          changes a hard-set hit or a probe on any corpus. RULED 2026-11-25
          (owner, "Yes, 0.60/0.60"): the 4B's gate is 0.60/0.60, built with
          this entry. Not known: whether the 44 prompts it stops were wanted
          (the replay has no labels). The 8B's gate was not swept and stays.
          (3) Lean's own count entry costs the starter packs 5 hard-set rows
          in hook mode (29/32 -> 24/32), all multi-hop: 2 by the five-row cap
          alone, 1 by the band alone, 2 by both. No setting short of the rule
          off restores all 5. A six-row cap restores 2 for +10% rows on the
          replay (5.21 -> 5.74 per injecting prompt) and one more leaked
          probe row; a wider band restores 1 at 0.10 and takes leaked probe
          rows 23 -> 34. RULED 2026-11-25 (owner, "Leave it"): lean's entry
          stays at band 0.05 / wide 0.18 / five rows. The six-row cap is not
          taken up until it is read on emgl and Skyline, the field corpora
          the rule was calibrated on; nothing in HCR is waiting on that read.
        calibration_state: >-
          2026-11-25, full width only. Qwen/Qwen3-Embedding-4B: floor 0.42,
          gate 0.60/0.60 (first 0.48/0.46; see hook_mode_findings), count rule band 0.12 / wide 0.14
          (HCR-3.count.evidence). Qwen/Qwen3-Embedding-8B: floor 0.40, gate
          0.50/0.48, count rule band 0.11 / wide 0.12 (HCR-3.8b.evidence;
          explicit mode 18/18, 32/32, 34/38 against lean's 18/18, 32/32,
          33/38, fixture abstention at parity). The 8B could not load before
          this run: its conversion ships no lm_head.weight, and the embedder
          now asks mlx_lm for no head. Both count entries cost no hard-set row
          in hook mode and halve the rows served on leaked off-topic probes;
          on 300 replayed prompts they trim 9.4 -> 8.1 (4B) and 9.6 -> 9.0
          (8B) rows per injecting prompt, median still 10 where lean's entry
          reads 5 — a tighter wide costs hard-set rows. Visible: `hippo eval
          --floor-sweep` also sweeps inside the resolved high space on a high
          machine (floor_sweep.high.json) and doctor's high-space line
          compares it with that space's own entries. NOT calibrated, on
          purpose, and doctor warns by name: every MRL-truncated width
          (model@dim). A truncation is a different cosine space, so it would
          need its own run (floor, gate, count, band check), and HCR-6's bench
          settled that none is worth one: at the 4B's 0.42 floor, 1024 found
          30/38 (MRR 0.598) and 2048 found 31/38 (MRR 0.578) against the full
          width's 31/38 (MRR 0.592); neither truncation adds a hit over the full
          width. The default is the native width and stays it. A machine
          that sets HIPPO_HIGH_EMBED_DIM anyway runs at the 0.50 default floor
          with the gate and the count rule off, and doctor's line tells it to
          unset the knob. The 8B's truncations were not benched; the same
          line covers them.

      - id: HCR-4
        title: Rerank seam upgrade — Qwen3-Reranker-0.6B warm-default, 4B explicit
        priority: P1
        effort: M
        status: done            # 2026-11-25: measured on the owner's Mac; planning/HCR-4.evidence.2026-11-25.json. Warm default turned OFF the same day on HCR-6's evidence (third owner ruling); explicit surfaces moved from the 4B to the 0.6B over a 30-hit pool (fourth ruling)
        gated_on: [HCR-2]
        problem: >-
          The rerank lane is a 2022 6-layer MiniLM, and it is off by default on
          the hot path because the spawn process pays its cold load per prompt
          — an objection warm mode removes, which nothing yet exploits.
        design: >-
          Per-profile reranker ids through the ONE shared _cross_encoder_rerank
          function (an MLX path beside the fastembed path, same run_bounded
          shape, same degrade-to-fused-order-on-any-failure contract): high
          profile warm mode runs Qwen3-Reranker-0.6B with HIPPO_RERANK
          defaulting ON there (Q3, ratified); explicit surfaces (/hippo:recall,
          MCP recall) get Qwen3-Reranker-4B; spawn path and lean profile keep
          today's behavior exactly. Rule-pointer exclusion and COR-8
          score-immutability carry over untouched.
        acceptance: >-
          Warm reranked recall stays inside SERVE_BUDGET_MS at the production
          candidate count on the owner's machine (measured); breaker telemetry
          shows no trip-rate regression over a soak window; QUA-6 ordering
          deltas favor or tie the reranked arm before the default stays ON.
        as_built: >-
          2026-11-25. rerank_mlx beside the seam: _cross_encoder_rerank scores
          through MLX when a Qwen3 reranker is active in the calling context (a
          ContextVar run_bounded carries), else through fastembed's MiniLM as
          before. Two callers enter one: recall_warm_high.serving on the high
          profile once the 0.6B has loaded in the background (kick starts it,
          independent of the embedder; HIPPO_RERANK unset means ON there, an
          explicit falsy value still means off; bound 0.8 s so a slow rerank
          degrades inside SERVE_BUDGET_MS), and recall_view.describe on the
          high profile when the 4B is servable (loaded on first use inside its
          own 15 s bound; a failed load is remembered and the process falls
          back to the MiniLM). One scoring per model at a time: a call that
          finds one still running keeps the fused order at once, because
          run_bounded cannot cancel an abandoned scoring and the next call
          would queue behind it on the one MLX thread. Spawned hook, lean and floor enter neither.
          Scoring is the model card's yes/no prompt, right-padded and gathered
          at the last real token, on embed_mlx.mlx_executor (now the process's
          one MLX thread for embedder and rerankers). Weights: mlx-community
          Qwen3-Reranker-{0.6B,4B}-mxfp8, revision-pinned (629 MB / 4.16 GB),
          fetched only by `hippo setup --profile high --fetch --yes`. The
          high-profile warm server pins OPENBLAS_NUM_THREADS=1 before numpy
          loads (HCR-2's measured excess). Instrument: bench/high_rerank.py
          (served latency ON vs OFF interleaved at k=10, breaker trips, the
          4B's describe latency, run_flag_arms per reranker over the lean and
          high indexes; counts only).
        ab_result: >-
          2026-11-25, planning/HCR-4.evidence.2026-11-25.json (owner's 128 GB
          Mac, live corpus, 38-row private fixture). Budget: warm served recall
          with the 0.6B ON over the hook's 13-21-candidate pool, median 592 /
          max 756 ms of 1500; every ON call reranked inside its 0.8 s bound; 0
          breaker trips in 72 calls (a bench soak; the live soak continues in
          use). Explicit 4B: 2.1 s median per /hippo:recall, 8.6 s first call
          (6.2 s load). QUA-6: both Qwen3 rerankers raise MRR in every category
          on both indexes (0.6B +0.025..+0.052, 4B +0.008..+0.096) and tie
          recall@10; the MiniLM loses 0.07-0.12 MRR everywhere. The 0.6B's
          default ON in high warm mode stays. It does NOT close HCR-3's
          high-vs-lean recall gap (30-31/38 vs 33/38): the seam reorders the
          final list, so recall@10 cannot move — that needs a deeper rerank
          pool or an upstream fix. First measurement found a queueing bug
          (24/36 warm calls past the bound, every explicit call pinned at 5 s),
          fixed before these numbers; both runs are in the evidence file.

      - id: HCR-5
        title: PPR graph lane — personalized PageRank over links.json (all profiles)
        priority: P0
        effort: M
        status: retired         # 2026-11-25: flat over the high index too (HCR-6); per D4 the lane, its flag and its rig are removed; GRA-1's 1-hop pull stays
        gated_on: []            # independent of HCR-1..4; lands even if the MLX tier stalls
        problem: >-
          GRA-1's 1-hop discount pull sees only direct neighbors of 3 seeds; the
          associative value of the corpus graph (multi-hop bridges dream keeps
          finding) never reaches ranking — the exact gap HippoRAG-2 (arXiv
          2502.14802) closes with PPR, on a graph hippo already persists.
        design: >-
          Replace the 1-hop pull in recall_graph.py with power-iteration PPR
          over GRA-6's links.json: personalization vector = the fused,
          penalty-adjusted scores of the top-k hits; damping ~0.85; PPR mass
          re-scored into candidates under the existing compete-for-top-k rule
          (no reserved slots, typed-edge penalties still apply AFTER). Numpy
          only, no new deps, budget-asserted sub-ms at 5k nodes. Ships behind
          HIPPO_GRAPH_PPR beside GRA-1 for the soak, then REPLACES it on the
          dated evidence flip (Q4, ratified) — the flag then retires rather
          than living as a fork.
        acceptance: >-
          A/B evidence file (ab_runner arm, GRF-4 reachability + QUA-6
          category deltas) showing multi-hop/associative gains without
          precision loss; latency delta indistinguishable; flip recorded as a
          dated owner decision here.
        as_built: >-
          2026-11-25. recall_graph._ppr_expand beside GRA-1's _expand_neighbors,
          same signature and return shape; recall() picks it only under
          HIPPO_GRAPH_PPR (falsy-set, default OFF — off never calls it). Seeds =
          GRA-1's (HIPPO_GRAPH_SEEDS, 3), personalization = their fused
          penalty-adjusted scores, damping 0.85, numpy power iteration over the
          seeds' 3-hop ball of links.json (CSR memoized per edge-list object;
          ~0.3 ms median at 5k nodes, test-pinned < 1 ms). Edge set and the
          draft guard are GRA-1/RET-13's exactly. Top 10 nodes by mass are
          endorsed and injected at 0.5 x top seed x relative mass, then share
          GRA-1's injection tail (_apply_injection: no reserved slots,
          invalidation + supersede penalties, organic-wins ties); hub damping,
          the once-per-session rule and GRF-2 seed endorsement hold. Rig:
          memory.graph_ppr_eval (eval --ab HIPPO_GRAPH_PPR) on
          ab_runner.run_flag_arms + GRF-4's audit and warm latency per arm.
        ab_result: >-
          planning/HCR-5.evidence.2026-11-25.json (12 runs, OFF-arm byte-
          identity self-check PASS on all). Two lane versions. v1 (08acec0,
          the walk's own top-10 endorsed set) on the live corpus with 11
          multi-hop rows: dense multi-hop recall 0.818 -> 0.727 (-1 of 11),
          MRR 0.329 -> 0.297, single-hop flat — the lost hit was
