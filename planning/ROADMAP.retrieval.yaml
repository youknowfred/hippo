      - id: HCR-6
        title: Evidence spine + docs capstone — bench-before-flip made mechanical
        priority: P1
        effort: M
        status: done            # 2026-11-25: harness + evidence + docs; every owner call ruled (open_for_owner)
        gated_on: [HCR-2, HCR-3, HCR-4, HCR-5]
        problem: >-
          The workstream's law (no flips without evidence) needs an instrument
          that makes the comparison one command, or it decays into vibes; and
          an unphotographed profile is support debt.
        design: >-
          A profile A/B harness on the ab_runner shape (lean vs high over the
          live corpus: QUA-6 deltas by category, token-injection cost, warm/
          cold latency percentiles, resident-RAM stamp; OFF-arm byte-identity
          self-check as ever); the MRL-dims decision for HCR-2 taken from its
          output; bench gates unchanged for lean/floor and stamped for high.
          Docs capstone: README + concepts page get the profile ladder, the
          setup offer, the degrade story, and the TrustGraph position (link
          the exploration; the question will be asked again).
        acceptance: >-
          One command emits the lean-vs-high evidence file; every HCR default
          flip in this file cites one; docs photograph the ladder end to end.
        as_built: >-
          2026-11-25. memory.profile_ab generalizes ab_runner's flag arm to a
          profile arm (embedding space + its index, reranker, rerank pool depth,
          held flags); the baseline runs first and last and the report is
          refused unless the two are byte-identical (lexical-only count
          included). bench/profile_ab.py is the one command: real models, temp
          indexes, every arm below, plus model load/resident memory, RSS, index
          build time and the spawned hook's cold latency. It sets the dense and
          rerank bounds to 120 s so no arm silently degrades (run 1, at load
          ~29, did exactly that and is kept in the evidence as contaminated).
          Docs: README "Retrieval profiles (opt-in)" + a CONCEPTS paragraph.
        ab_result: >-
          planning/HCR-6.evidence.2026-11-25.json (run 3; load median 10, so
          quality is the evidence and latency is load-stamped). 38 rows. lean
          33/38 MRR 0.569; lean+rerank 33 / 0.619; high 31 / 0.592; high+rerank
          (the shipped warm default) 31 / 0.573; high+rerank, pool 30: 34 /
          0.604, the only arm above lean; lean+rerank, pool 30: 33 / 0.630;
          high+walk 30 / 0.579; explicit 4B rerank 31 / 0.570. MRL width
          SETTLED: keep native 2560 (1024: 30 / 0.598, 2048: 31 / 0.578 at the
          same floor). Injection flat (578-597 tokens).
        eight_b_arm: >-
          2026-11-25, after #240 made the 8B loadable and calibrated it.
          bench/profile_ab.py now runs every other high embedder on disk as
          its own arms (--models), stamping its load time and resident memory.
          planning/HCR-6.8b.evidence.2026-11-25.json, same corpus and 38 rows,
          baseline self-check pass: high-8b 34/38 MRR 0.596 (4B 31 / 0.592,
          lean 33 / 0.569); with the warm reranker over the top 10, 34 / 0.652,
          the best MRR measured; with the 30-hit pool the explicit surfaces
          run, 33 / 0.609 against the 4B's 34 / 0.604. In the prompt hook both
          read 26/38 and the 8B's MRR is lower (0.498 vs 0.524); counting
          floor-collapsed memories as found, 33/38 each (0.592 vs 0.624).
          Cost: 7.80 GB resident against 4.15, load 6.2 s against 2.5 (18.7 s
          first load), index build 199 s against 92, recall median 319 ms
          against 168. RULED 2026-11-25 (fifth owner ruling): the 4B stays
          high's default; the 8B stays a knob.
        open_for_owner: >-
          FULLY RULED 2026-11-25. (1) high's warm rerank default is off (third
          owner ruling, built in #242); the explicit surfaces drop the 4B for
          the 0.6B (fourth ruling, E1); (2) the deep pool applies on the
          explicit surfaces only, 30 fused hits then the cut to k (E2; built
          with E1 in one change); (3) D2: no flip, lean's warm path stays
          without rerank (E3; no code change); (4) per D4 the PPR flag retires,
