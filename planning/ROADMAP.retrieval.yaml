# ============================================================================
# hippo — the high-ceiling retrieval profile (EXECUTABLE roadmap)
# ============================================================================
# The EXECUTABLE form of EXPLORATIONS.retrieval.md (RATIFIED as recommended,
# Fred, in-session, 2026-11-25). One workstream — HCR — that adds an opt-in
# `high` retrieval profile (Qwen3-Embedding-4B/8B dense + Qwen3-Reranker via
# MLX, warm-mode-first) and a PPR graph lane for ALL profiles, while leaving
# lean (bge-small) the default and BM25-only the floor.
#
# STATE 2026-11-25: HCR-1..4 and HCR-6 are done; HCR-5 (the PPR lane) was built,
# measured flat and retired. Each item's status line below says what shipped.
# 2026-11-26: HCR-7 (one shared embedder per machine) is proposed and unbuilt.
#
# HCR ids are a NEW namespace: no collision with SIG/RUL/RCL/GOV/GRW/RCH,
# MSR/GRF/SEN/TMB/CLB/IOP, RET/GRA/LIF/CAP/INT/TEA/SEC, DRM, REL/MEA/WRT/OPS/
# BND, FLT/HYG/PUB/EVD, RWY/OBS/HOT/CLM/TND/FMT/SRF/PLT/NAT/CON, or any
# ROADMAP.v1/v2 id (checked by grep at authoring).
#
# Companion documents:
#   planning/EXPLORATIONS.retrieval.md — the design + candidate field + verdicts
#   ic-memobot docs/plans/active/trustgraph-for-agent-memory-exploration-2026-06-23.md
#     — the standing TrustGraph rejection this exploration re-affirmed
# ============================================================================

meta:
  title: hippo — high-ceiling retrieval profile (HCR workstream)
  repo: youknowfred/hippo
  authored: 2026-11-25
  baseline_ref: b1554d2          # main HEAD (v1.47.0) at authoring time
  baseline_state: >-
    main @ v1.47.0. Recall is hybrid BM25 (PRF-1 postings + RET-2 body chunks) +
