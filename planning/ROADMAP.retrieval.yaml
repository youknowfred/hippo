    explicit surfaces, HIPPO_RERANK-gated + 5s-bounded on the hot path. Budgets:
    GATE_P95_MS=300 (spawn), SERVE_BUDGET_MS=1500 / COLD_BUDGET_MS=4000 (HOT-6
